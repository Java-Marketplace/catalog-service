databaseChangeLog:
  - changeSet:
      id: 1
      author: Kostyanchik
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: category
      changes:
        - createTable:
            tableName: category
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: parent_id
                  type: bigint
                  constraints:
                    nullable: true
                    foreignKeyName: fk_category_parent
                    references: category(id)